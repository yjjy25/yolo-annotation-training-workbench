name: Source checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix desktop run check
      - run: npm --prefix desktop test
      - run: python -m compileall -q X-AnyLabeling/anylabeling .packaging .runtime/launcher.pyw
